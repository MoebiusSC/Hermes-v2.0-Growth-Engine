name: Hermes Growth Benchmark

on:
  push:
    branches:
      - research/hermes-benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run Hermes 730d benchmark
        run: |
          python -m hermes_trading.growth_run backtest --days 730 | tee hermes_730d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-730d
          path: hermes_730d.json
