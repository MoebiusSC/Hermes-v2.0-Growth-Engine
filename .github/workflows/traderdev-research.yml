name: TraderDev Reconstruction Research

on:
  push:
    branches:
      - research/traderdev-replicas

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run reconstruction
        run: |
          python -m hermes_trading.traderdev_research --days 730 | tee traderdev_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traderdev-results
          path: traderdev_results.json
